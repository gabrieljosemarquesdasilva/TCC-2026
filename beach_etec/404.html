<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Beach Tennis ETEC</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.err404-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:var(--dark);position:relative;overflow:hidden}
.err404-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 900px 600px at 15% 0%,rgba(255,107,53,.10) 0%,transparent 60%),radial-gradient(ellipse 900px 700px at 85% 100%,rgba(0,119,182,.14) 0%,transparent 60%)}
.err404-ball{font-size:5rem;margin-bottom:8px;animation:err404bounce 1.6s ease-in-out infinite;position:relative}
@keyframes err404bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
.err404-code{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:7rem;line-height:1;color:#fff;letter-spacing:.02em;position:relative}
.err404-code span{color:var(--coral)}
.err404-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.8rem;color:#fff;margin:8px 0 6px;position:relative}
.err404-text{color:rgba(255,255,255,.65);max-width:420px;margin:0 auto 32px;position:relative}
.err404-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;position:relative}
@media(max-width:480px){.err404-code{font-size:4.5rem}.err404-ball{font-size:3.5rem}}
</style>
</head>
<body>
<div class="err404-wrap">
  <div class="err404-ball">🎾</div>
  <div class="err404-code">4<span>0</span>4</div>
  <h1 class="err404-title">Essa bola caiu fora da quadra</h1>
  <p class="err404-text">A página que você procura não existe ou foi movida. Que tal voltar para o jogo?</p>
  <div class="err404-actions">
    <a href="/index.html" class="botao-agendar"><i class="fa-solid fa-house"></i> Voltar ao Início</a>
    <a href="/agendamento.html" class="btn-outline"><i class="fa-solid fa-calendar-check"></i> Agendar Quadra</a>
  </div>
</div>
</body>
</html>
